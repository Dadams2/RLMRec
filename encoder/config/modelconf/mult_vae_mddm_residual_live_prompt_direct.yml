# Mult-VAE MDDM residual live prompting with direct exact-width embeddings.
# This variant assumes the embedding server already returns the recommender's
# semantic width, so no runtime adapter is used.

optimizer:
  name: adam
  lr: 1.0e-3
  weight_decay: 0

train:
  epoch: 1000
  batch_size: 1024
  save_model: True
  loss: pairwise
  test_step: 3
  reproducible: true
  seed: 2024
  patience: 20
  trainer: vae_trainer

test:
  metrics: [recall, ndcg]
  k: [5, 10, 20]
  batch_size: 1024

live_prompting:
  enabled: true
  embedding_model: Qwen/Qwen3-Embedding-4B
  embedding_dimensions: 1536

data:
  type: general_cf
  name: amazon

model:
  name: mult_vae_mddm_residual_live_prompt_direct
  dropout: 0.2
  reg_weight: 1.0e-6
  correction_scale: 0.1
  warmup_epochs: 10

  amazon:
    dropout: 0.3
    beta: 0.6
    reg_weight: 1.0e-6
    correction_scale: 0.1
    warmup_epochs: 10

  yelp:
    dropout: 0.3
    beta: 0.4
    reg_weight: 1.0e-6
    correction_scale: 0.1
    warmup_epochs: 10

  steam:
    dropout: 0.2
    beta: 0.5
    reg_weight: 1.0e-6
    correction_scale: 0.1
    warmup_epochs: 10

  embedding_size: 32